<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>포켓몬 카드 배틀</title><style> *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#385ca5,#101b38);color:white;font: bold 18px system-ui;text-align:center}main{max-width:850px;margin:auto;padding:18px}h1{color:#ffe45c;text-shadow:3px 3px #234b9b}.arena{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:linear-gradient(135deg,#fff9ce,#c5eaff);color:#18304d;border:7px solid #eac449;border-radius:22px;padding:10px;box-shadow:0 8px 25px #0005}.card img{width:100%;aspect-ratio:1;object-fit:contain;background:#ffffff66;border-radius:12px}.card h2{margin:4px;font-size:24px}button,input,select{font:inherit;border:0;border-radius:14px;padding:13px;margin:5px 0}button{background:#ffcc32;color:#152746;cursor:pointer}input,select{width:100%;min-width:0}progress{width:100%;accent-color:#27ae60}#log{background:#ffffff20;padding:16px;border-radius:16px;min-height:65px}.hit{animation:hit .35s}@keyframes hit{50%{transform:scale(.9) rotate(4deg);filter:brightness(1.5)}}small{font-weight:normal}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.toolbar button{margin:0}.primary{background:#ffce36;font-size:23px;width:100%;padding:18px}.secondary{background:#dbeafe}.typebadge{display:inline-flex;align-items:center;gap:5px;border-radius:30px;padding:5px 12px;margin:3px;color:white;text-shadow:0 1px 2px #0008;font-size:14px}.card{position:relative}.card h2{font-size:clamp(18px,4vw,28px)}.winner{background:linear-gradient(120deg,#fff2a8,#ffcc32);color:#172554;border:3px solid white;border-radius:20px;padding:18px;margin:14px 0;font-size:24px}.winner img{display:block;width:120px;margin:auto}.hptext{font-size:13px;color:#234}details{background:#ffffff18;padding:12px;border-radius:16px;margin-top:12px}summary{cursor:pointer}#micButton{background:#7957e8;color:white}#micStatus:empty{display:none}</style><main><h1>⚡ 포켓몬 카드 배틀</h1><p id="status">전국도감 불러오는 중…</p><div class="arena"><div class="card" id="c0"><small>내 포켓몬</small><h2 id="n0"></h2><img id="i0"><div id="t0"></div><div class="hptext" id="hp0">HP 100 / 100</div><progress id="h0" max="100" value="100"></progress><input id="s0" list="dex" placeholder="포켓몬 이름"></div><div class="card" id="c1"><small>상대 포켓몬</small><h2 id="n1"></h2><img id="i1"><div id="t1"></div><div class="hptext" id="hp1">HP 100 / 100</div><progress id="h1" max="100" value="100"></progress><input id="s1" list="dex" placeholder="포켓몬 이름"></div></div><datalist id="dex"></datalist><div class="toolbar"><button id="micButton" onclick="mic()">🎙️ 이름 말하기</button><button class="secondary" onclick="randomBattle()">🎲 랜덤 선택</button></div><button class="primary" onclick="auto()">⚔️ 대결 시작!</button><div class="toolbar"><button class="secondary" onclick="attack()">👊 한 번 공격</button><button class="secondary" onclick="reset()">🔄 다시 하기</button></div><div id="winner" class="winner" hidden></div><p id="micStatus" role="status" style="color:#ffe45c"></p><p id="log" aria-live="polite">피카츄 대 꼬부기!</p><details><summary>💬 채팅으로 포켓몬 선택</summary><input id="chat" placeholder="피카츄 대 리자몽"><button onclick="chat(document.getElementById('chat').value)">💬 말하기</button></details><p><small>어린이용 간단 규칙 · 비공식 팬 게임</small></p></main><script>const $=x=>document.getElementById(x);let names={25:'피카츄',7:'꼬부기',6:'리자몽',1:'이상해씨',4:'파이리',150:'뮤츠',643:'레시라무',644:'제크로무',384:'레쿠쟈'},ids=[25,7],hp=[100,100],turn=0,busy=false,types=[[],[]],epoch=0;const ko={fire:'불꽃',water:'물',grass:'풀',electric:'전기',dragon:'드래곤',normal:'노말',psychic:'에스퍼',ground:'땅',ice:'얼음',rock:'바위',fairy:'페어리',fighting:'격투',dark:'악',ghost:'고스트',steel:'강철',flying:'비행',bug:'벌레',poison:'독'};const typeStyle={fire:['🔥','#d94b25'],water:['💧','#1976d2'],grass:['🌿','#31833d'],electric:['⚡','#a87900'],dragon:['🐉','#6745c4'],normal:['⭐','#77736e'],psychic:['🔮','#c43c85'],ground:['🏜️','#99652c'],ice:['❄️','#24899c'],rock:['🪨','#82703d'],fairy:['✨','#c44d98'],fighting:['🥊','#b43c31'],dark:['🌙','#383343'],ghost:['👻','#66528c'],steel:['⚙️','#657784'],flying:['🪽','#5579bc'],bug:['🐛','#66851e'],poison:['☠️','#8a399f']};function badges(i){let el=$('t'+i);el.replaceChildren(...types[i].map(t=>{let x=document.createElement('span');x.className='typebadge';let z=typeStyle[t]||['⭐','#555'];x.style.background=z[1];x.textContent=z[0]+' '+(ko[t]||t);return x}))}function showWinner(i){let w=$('winner');w.hidden=false;w.replaceChildren();let img=document.createElement('img');img.src='/art/'+ids[i];let label=document.createElement('div');label.textContent='🏆 '+(names[ids[i]]||'#'+ids[i])+' 승리!';let sub=document.createElement('small');sub.textContent='두 포켓몬 모두 잘 싸웠어!';w.append(img,label,sub)}function say(s){$('log').textContent=s;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='ko-KR';speechSynthesis.speak(u)}catch{}}async function load(){try{let r=await fetch('/names');if(!r.ok)throw Error();let a=await r.json();for(let [id,n] of a)names[id]=n;$('dex').replaceChildren(...Object.entries(names).map(([id,n])=>{let o=document.createElement('option');o.value=n;return o}));$('status').textContent=Object.keys(names).length+'종의 포켓몬!'}catch{$('status').textContent='도감 연결 실패 · 새로고침해 주세요'}}async function draw(i){let id=ids[i];$('n'+i).textContent=names[id]||'#'+id;$('s'+i).value=names[id]||id;let im=$('i'+i);im.onerror=()=>{im.onerror=null;im.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/'+id+'.png'};im.src='/art/'+id;types[i]=[];$('t'+i).textContent='속성 확인 중…';try{let a=await fetch('/type/'+id).then(r=>{if(!r.ok)throw Error();return r.json()});if(ids[i]!==id)return;types[i]=a;badges(i)}catch{$('t'+i).textContent='속성 연결 실패 · 다시 시도'}}function reset(){$('winner').hidden=true;epoch++;busy=false;hp=[100,100];turn=0;[0,1].forEach(i=>{$('h'+i).value=100;$('hp'+i).textContent='HP 100 / 100';draw(i)})}function pick(s){return Number(Object.keys(names).find(k=>names[k]===s))||0}for(let i of [0,1])$('s'+i).onchange=()=>{let id=pick($('s'+i).value);if(id){ids[i]=id;reset()}else say('도감에서 이름을 골라 줘!')};function chat(s){let a=Object.entries(names).filter(([id,n])=>s.includes(n)).sort((a,b)=>s.indexOf(a[1])-s.indexOf(b[1])||b[1].length-a[1].length);if(a.length){ids[0]=+a[0][0];if(a[1])ids[1]=+a[1][0];reset();say(names[ids[0]]+' 대 '+names[ids[1]]+'!')}else if(s.includes('공격'))attack();else say('좋아하는 포켓몬 이름을 말해 줘!')}let recognition=null;function mic(){const b=$('micButton'),s=$('micStatus');if(recognition){recognition.stop();return}let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){s.textContent='이 브라우저는 음성 인식을 지원하지 않아요. Chrome에서 열어 주세요.';return}if(!window.isSecureContext){s.textContent='HTTPS 주소에서 열어 주세요.';return}try{speechSynthesis.cancel()}catch{}let r=new R();recognition=r;r.lang='ko-KR';r.interimResults=true;r.maxAlternatives=3;b.textContent='⏹ 듣기 종료';s.textContent='🎙️ 마이크 연결 중…';r.onstart=()=>{s.textContent='🔴 듣고 있어요! 포켓몬 이름을 말해 주세요.'};r.onresult=e=>{let t=e.results[e.results.length-1][0].transcript;s.textContent='들은 말: '+t;if(e.results[e.results.length-1].isFinal){$('chat').value=t;chat(t)}};r.onerror=e=>{s.textContent=({'not-allowed':'마이크 권한이 차단됐어요. Chrome 사이트 설정에서 마이크를 허용해 주세요.','no-speech':'목소리를 듣지 못했어요. 다시 눌러 주세요.','network':'음성 인식 서버 연결 실패. 인터넷과 Chrome을 확인해 주세요.','audio-capture':'마이크를 사용할 수 없어요.'})[e.error]||'음성 인식 오류: '+e.error};r.onend=()=>{recognition=null;b.textContent='🎙️ 이름 말하기';if(s.textContent.includes('듣고 있어요')||s.textContent.includes('연결 중'))s.textContent='듣기 종료 · 다시 눌러 주세요.'};try{r.start()}catch(e){recognition=null;b.textContent='🎙️ 이름 말하기';s.textContent='마이크 시작 실패: '+e.message}}function randomBattle(){ids=[1+Math.floor(Math.random()*1025),1+Math.floor(Math.random()*1025)];reset()}const adv={fire:['grass','ice','bug','steel'],water:['fire','rock','ground'],grass:['water','rock','ground'],electric:['water','flying'],ice:['dragon','grass','ground','flying'],ground:['electric','fire','steel','rock','poison'],fairy:['dragon','dark','fighting'],fighting:['normal','rock','steel','ice','dark'],dark:['psychic','ghost'],psychic:['fighting','poison'],dragon:['dragon'],ghost:['psychic','ghost'],rock:['fire','flying','ice','bug'],flying:['grass','fighting','bug'],steel:['ice','rock','fairy'],poison:['grass','fairy'],bug:['grass','psychic','dark']};function attack(){if(hp.includes(0))return;let i=turn++%2,j=1-i;let strong=types[i].some(t=>types[j].some(u=>(adv[t]||[]).includes(u)));hp[j]=Math.max(0,hp[j]-Math.floor(15+Math.random()*10+(strong?12:0)));$('h'+j).value=hp[j];$('hp'+j).textContent='HP '+hp[j]+' / 100';if(hp[j]===0)showWinner(i);$('c'+j).classList.remove('hit');void $('c'+j).offsetWidth;$('c'+j).classList.add('hit');say(hp[j]===0?'🏆 '+names[ids[i]]+' 승리! 둘 다 잘 싸웠어!':names[ids[i]]+' 공격! '+(strong?'효과가 굉장해!':''))}async function auto(){if(busy)return;busy=true;let e=epoch;while(e===epoch&&!hp.includes(0)){attack();await new Promise(r=>setTimeout(r,2300))}if(e===epoch)busy=false}reset();load()</script></html>
