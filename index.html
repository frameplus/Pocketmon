<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>포켓몬 카드 아레나</title><link rel="stylesheet" href="/field.css"><link rel="stylesheet" href="/style.css"><script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.min.js"}}</script></head>
<body><header><div class="bar">
<div class="brandblock"><a href="#battle" class="brand"><i class="ball" aria-hidden="true"></i><span data-en="Card Arena">카드 아레나</span></a></div>
<nav aria-label="게임 메뉴" data-en-label="Game menu"><a href="#battle"><i aria-hidden="true">⚔</i><span data-en="Battle">대결</span></a><a href="#dex"><i aria-hidden="true">▦</i><span data-en="Pokédex">도감</span></a><a href="#friend"><i aria-hidden="true">☏</i><span data-en="AI Buddy">AI 친구</span></a><a href="#history"><i aria-hidden="true">◷</i><span data-en="History">기록</span></a></nav>
<button class="gear" id="settings" aria-label="부모 설정" data-en-label="Parent settings">⚙</button></div></header>
<main><p id="loading" data-en="Opening your cards…">포켓몬 카드를 꺼내고 있어요…</p>
<section id="battle" hidden>
<div id="chooser"><div class="title"><h1 data-en="Pokémon Battle">포켓몬 대결</h1></div>
<div class="pair"><div id="slot0"></div><strong class="vs" aria-hidden="true">VS</strong><div id="slot1"></div></div>
<div class="launch"><button class="mainbtn" id="start" data-en="▶ Start battle">▶ 대결 시작</button></div></div>
<article id="arena" hidden aria-label="배틀 필드" data-en-label="Battle arena"><div class="arenahead"><b id="round"></b><div class="transport"><button id="speed" aria-label="두 배속" data-en-label="Double speed" aria-pressed="false">2×</button><button id="skip" aria-label="결과로 건너뛰기" data-en-label="Skip to result">⏭</button><button id="exit" aria-label="대결 나가기" data-en-label="Exit battle">✕</button></div></div><div id="scoreboard"></div><div class="field" id="battlefield" data-scene="ready"><div class="meadow" aria-hidden="true"></div><canvas class="world" aria-hidden="true"></canvas><div class="entrance-props" aria-hidden="true"></div><div id="actors"></div><canvas class="technique-fx" aria-hidden="true" hidden></canvas><span class="move-call" aria-hidden="true" hidden></span><span class="hit-points" aria-hidden="true" hidden></span><div id="celebration" role="status" hidden><div class="victory-ribbon"><strong id="victory-word"></strong><b id="victory-name"></b></div></div></div><p id="log" aria-live="polite"></p></article><div id="result" hidden></div></section>
<section id="dex" hidden><div class="title"><div><h1><span data-en="Pokédex">포켓몬 도감</span></h1><p data-en="Explore 1,025 species and 48 Mega forms.">전국도감 1,025종과 메가진화 48개 폼을 만나 봐.</p></div></div>
<p id="dexPick" hidden></p><div class="dex-tools"><input id="dexquery" placeholder="이름 · 초성 · 도감 번호" data-en-placeholder="Name or Pokédex number" aria-label="도감 검색" data-en-label="Search Pokédex">
<div id="typeStrip" role="group" aria-label="속성" data-en-label="Types"></div>
<details class="advanced"><summary data-en="More filters">더보기</summary><div class="filters"><label><span data-en="Category">분류</span><select id="kindFilter"></select></label><label><span data-en="Region">지방</span><select id="regionFilter"></select></label></div></details>
<div class="dex-nav"><div class="switch"><button id="dexOrder" aria-pressed="true" data-en="Dex order">도감 번호순</button><button id="powerOrder" aria-pressed="false" data-en="Power ranking">파워 순위</button></div><span id="found" role="status"></span></div></div>
<p id="rankRule" hidden data-en="Overall rank by the sum of all six base stats. Equal totals share a rank.">6개 종족값의 합계로 매긴 전체 순위입니다. 합계가 같으면 공동 순위입니다.</p>
<div id="catalog"></div><button id="more" data-en="Show more">더 보기</button></section>
<section id="friend" hidden><div class="title"><div><h1><span data-en="AI Pokémon Buddy">AI 포켓몬 친구</span></h1><p data-en="Ask about your favorite Pokémon!">좋아하는 포켓몬 이야기를 나눠 봐!</p></div></div><div class="panel"><div class="conversation"><img class="buddy" src="/art/25" alt="Pikachu"><div id="talk" role="log"></div></div><div id="examples"><button data-en="What makes Reshiram strong?">레시라무는 왜 강해?</button><button data-en="What moves does Squirtle know?">꼬부기는 무슨 기술을 써?</button><button data-en="Who can beat Mewtwo?">뮤츠보다 강한 포켓몬은 누구야?</button></div><form id="chat"><input maxlength="250" id="message" required aria-label="친구에게 할 말" data-en-label="Ask your buddy" placeholder="궁금한 걸 물어봐" data-en-placeholder="Ask your buddy"><button type="button" data-mic data-en="🎙 Talk">🎙 말하기</button><button type="submit" class="mainbtn" data-en="Send">보내기</button></form></div></section>
<section id="history" hidden><div class="title"><div><h1><span data-en="Battle history">대결 기록</span></h1><p data-en="Recent battles on this device.">이 기기에서 함께한 최근 대결이야.</p></div></div><div id="records"></div></section>
<div id="speech" hidden role="status"></div></main><footer><span data-en="Unofficial fan game · Pokémon © Nintendo / Creatures / GAME FREAK">비공식 포켓몬 팬 게임 · Pokémon © Nintendo / Creatures / GAME FREAK</span> · <a href="/model-credits.html" data-en="3D model credits">3D 모델 출처</a></footer>
<dialog id="modal"><div id="modalbody"></div>
<div id="parentExtras" hidden><label><span data-en="My trainer name">내 트레이너 이름</span><input id="trainer0" maxlength="24"></label><label><span data-en="Opponent trainer name">상대 트레이너 이름</span><input id="trainer1" maxlength="24"></label><div class="parent-row"><b id="visits">오늘 방문자 집계 중…</b><button id="language">English</button></div></div><button id="close" data-en="Close">닫기</button></dialog>
<script defer src="/game.js"></script><script defer src="/locale.js"></script><script defer src="/visit.js"></script><script defer src="/field.js"></script><script defer src="/combat.js"></script><script defer src="/narrator.js"></script><script defer src="/app.js"></script></body></html>
