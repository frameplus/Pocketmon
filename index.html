<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#203f3d"><title>포켓몬 카드 아레나</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="bar"><a href="#battle" class="brand"><i class="ball"></i>카드 아레나</a><nav><a href="#battle">포켓몬 대결</a><a href="#dex">포켓몬 도감</a><a href="#friend">AI 포켓몬 친구</a><a href="#history">대결 기록</a></nav><button class="gear" id="settings" aria-label="부모 설정">⚙</button></div></header><main><p id="loading">포켓몬 카드를 꺼내고 있어요…</p>
<section id="battle" hidden><div class="title"><div><h1>포켓몬 대결<em>.</em></h1><p>카드 두 장을 골라 나만의 대결을 시작해!</p></div><button id="random">⤨ 랜덤 대결</button></div><div class="pair"><div id="slot0"></div><i class="vs">VS</i><div id="slot1"></div></div>
<details id="prediction" open><summary>예상 승률</summary><div id="odds"></div></details><div class="actions"><button class="mainbtn" id="start">▶ 대결 시작</button><button data-mic>🎙 이름 말하기</button></div>
<article id="arena"><div class="arenahead"><span>●　배틀 필드</span><b id="round">준비 완료</b></div><div class="field"><canvas id="land" width="480" height="160" aria-hidden="true"></canvas><div id="actors"></div><i id="fx" aria-hidden="true"></i></div><p id="log" aria-live="polite"></p></article><div id="result" hidden></div></section>
<section id="dex" hidden><div class="title"><div><h1>포켓몬 도감<em>.</em></h1><p>전국도감 1,025종과 메가진화 카드를 만나 봐.</p></div></div><input id="dexquery" placeholder="한국어 · 영어 · 초성 · 도감 번호" aria-label="도감 검색"><div id="catalog"></div><button id="more">더 보기</button></section>
<section id="friend" hidden><div class="title"><div><h1>AI 포켓몬 친구<em>.</em></h1><p>좋아하는 포켓몬 이야기를 나눠 봐!</p></div></div><div class="panel"><img class="buddy" src="/art/25" alt="피카츄"><div id="talk" role="log"></div><div id="examples"><button>레시라무는 왜 강해?</button><button>꼬부기는 무슨 기술을 써?</button><button>뮤츠보다 강한 포켓몬은 누구야?</button></div><form id="chat"><input maxlength="250" id="message" required aria-label="친구에게 할 말" placeholder="궁금한 걸 물어봐"><button class="mainbtn">보내기</button></form><button data-mic>🎙 말하기</button></div></section>
<section id="history" hidden><div class="title"><div><h1>대결 기록<em>.</em></h1><p>이 기기에서 함께한 최근 대결이야.</p></div></div><div id="records"></div></section><div id="speech" hidden role="status"></div></main><footer>비공식 포켓몬 팬 게임 · Pokémon © Nintendo / Creatures / GAME FREAK</footer><dialog id="modal"><div id="modalbody"></div><button id="close">닫기</button></dialog><script defer src="/game.js"></script><script defer src="/field.js"></script><script defer src="/app.js"></script></body></html>
