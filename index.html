<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>포켓몬 카드 배틀</title><style> *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#385ca5,#101b38);color:white;font: bold 18px system-ui;text-align:center}main{max-width:850px;margin:auto;padding:18px}h1{color:#ffe45c;text-shadow:3px 3px #234b9b}.arena{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:linear-gradient(135deg,#fff9ce,#c5eaff);color:#18304d;border:7px solid #eac449;border-radius:22px;padding:10px;box-shadow:0 8px 25px #0005}.card img{width:100%;aspect-ratio:1;object-fit:contain;background:#ffffff66;border-radius:12px}.card h2{margin:4px;font-size:24px}button,input,select{font:inherit;border:0;border-radius:14px;padding:13px;margin:5px 0}button{background:#ffcc32;color:#152746;cursor:pointer}input,select{width:100%;min-width:0}progress{width:100%;accent-color:#27ae60}#log{background:#ffffff20;padding:16px;border-radius:16px;min-height:65px}.hit{animation:hit .35s}@keyframes hit{50%{transform:scale(.9) rotate(4deg);filter:brightness(1.5)}}small{font-weight:normal}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.toolbar button{margin:0}.primary{background:#ffce36;font-size:23px;width:100%;padding:18px}.secondary{background:#dbeafe}.typebadge{display:inline-flex;align-items:center;gap:5px;border-radius:30px;padding:5px 12px;margin:3px;color:white;text-shadow:0 1px 2px #0008;font-size:14px}.card{position:relative}.card h2{font-size:clamp(18px,4vw,28px)}.winner{background:linear-gradient(120deg,#fff2a8,#ffcc32);color:#172554;border:3px solid white;border-radius:20px;padding:18px;margin:14px 0;font-size:24px}.winner img{display:block;width:120px;margin:auto}.hptext{font-size:13px;color:#234}details{background:#ffffff18;padding:12px;border-radius:16px;margin-top:12px}summary{cursor:pointer}#micButton{background:#7957e8;color:white}#micStatus:empty{display:none}.card{min-width:0;padding:8px}.card img{max-height:240px}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:12px;text-align:left;margin:8px 0}.statgrid span{background:#ffffffaa;border-radius:7px;padding:6px}.moves{font-size:12px;text-align:left;background:#ffffff99;border-radius:8px;padding:7px;margin:6px 0}.searchwrap{position:relative}.suggest{position:absolute;z-index:9;top:100%;left:0;right:0;max-height:240px;overflow:auto;background:white;border-radius:10px;box-shadow:0 5px 15px #0004}.suggest button{display:flex;align-items:center;gap:7px;width:100%;background:white;text-align:left;font-size:14px;padding:6px;margin:0}.suggest img{width:36px;height:36px}.suggest:empty{display:none}#odds small{display:block;font-size:13px;line-height:1.5}#winner p{line-height:1.6}#winner[hidden],#odds[hidden],#log[hidden]{display:none!important}</style><main><h1>⚡ 포켓몬 카드 배틀</h1><p id="status">전국도감 불러오는 중…</p><div class="arena"><div class="card" id="c0"><small>내 포켓몬</small><h2 id="n0"></h2><img id="i0"><div id="t0"></div><div class="hptext" id="hp0">HP 100 / 100</div><progress id="h0" max="100" value="100"></progress><div id="stats0" class="statgrid"></div><div id="moves0" class="moves"></div><div class="searchwrap"><input id="s0" autocomplete="off" placeholder="포켓몬 검색"><div class="suggest" id="suggest0"></div></div></div><div class="card" id="c1"><small>상대 포켓몬</small><h2 id="n1"></h2><img id="i1"><div id="t1"></div><div class="hptext" id="hp1">HP 100 / 100</div><progress id="h1" max="100" value="100"></progress><div id="stats1" class="statgrid"></div><div id="moves1" class="moves"></div><div class="searchwrap"><input id="s1" autocomplete="off" placeholder="포켓몬 검색"><div class="suggest" id="suggest1"></div></div></div></div><datalist id="dex"></datalist><div class="toolbar"><button id="micButton" onclick="mic()">🎙️ 이름 말하기</button><button class="secondary" onclick="randomBattle()">🎲 랜덤 선택</button></div><button class="primary" id="battleStart" onclick="auto()">⚔️ 대결 시작!</button><div class="toolbar"><button class="secondary" onclick="attack()">👊 한 번 공격</button><button class="secondary" onclick="reset()">🔄 다시 하기</button></div><div id="odds" style="background:#ffffff20;border-radius:16px;padding:14px;margin:12px 0" aria-live="polite">승률 계산 중…</div><div id="winner" class="winner" hidden></div><p id="micStatus" role="status" style="color:#ffe45c"></p><p id="log" aria-live="polite">피카츄 대 꼬부기!</p><details><summary>💬 채팅으로 포켓몬 선택</summary><input id="chat" placeholder="피카츄 대 리자몽"><button onclick="chat(document.getElementById('chat').value)">💬 말하기</button></details><p><small>어린이용 간단 규칙 · 비공식 팬 게임</small></p></main><script>const $=x=>document.getElementById(x);let names={25:'피카츄',7:'꼬부기',6:'리자몽',1:'이상해씨',4:'파이리',150:'뮤츠',643:'레시라무',644:'제크로무',384:'레쿠쟈'},ids=[25,7],hp=[100,100],turn=0,busy=false,types=[[],[]],epoch=0;const ko={fire:'불꽃',water:'물',grass:'풀',electric:'전기',dragon:'드래곤',normal:'노말',psychic:'에스퍼',ground:'땅',ice:'얼음',rock:'바위',fairy:'페어리',fighting:'격투',dark:'악',ghost:'고스트',steel:'강철',flying:'비행',bug:'벌레',poison:'독'};const typeStyle={fire:['🔥','#d94b25'],water:['💧','#1976d2'],grass:['🌿','#31833d'],electric:['⚡','#a87900'],dragon:['🐉','#6745c4'],normal:['⭐','#77736e'],psychic:['🔮','#c43c85'],ground:['🏜️','#99652c'],ice:['❄️','#24899c'],rock:['🪨','#82703d'],fairy:['✨','#c44d98'],fighting:['🥊','#b43c31'],dark:['🌙','#383343'],ghost:['👻','#66528c'],steel:['⚙️','#657784'],flying:['🪽','#5579bc'],bug:['🐛','#66851e'],poison:['☠️','#8a399f']};const stats=[null,null];const moveKo={'thunderbolt':'10만볼트','thunder':'번개','quick-attack':'전광석화','tackle':'몸통박치기','growl':'울음소리','scratch':'할퀴기','ember':'불꽃세례','flamethrower':'화염방사','water-gun':'물대포','hydro-pump':'하이드로펌프','vine-whip':'덩굴채찍','razor-leaf':'잎날가르기','solar-beam':'솔라빔','ice-beam':'냉동빔','psychic':'사이코키네시스','dragon-claw':'드래곤클로','dragon-pulse':'용의파동','shadow-ball':'섀도볼','bite':'물기','surf':'파도타기','protect':'방어','rest':'잠자기','iron-tail':'아이언테일','fly':'공중날기','earthquake':'지진'};function cardStats(i,a){let el=$('stats'+i);el.replaceChildren();for(let [key,label] of [['hp','체력'],['attack','공격'],['defense','방어'],['special-attack','특수공격'],['special-defense','특수방어'],['speed','스피드']]){let x=document.createElement('span');x.textContent=label+' '+(a.stats?.[key]??'–');el.append(x)}let m=$('moves'+i);m.textContent='기술 · '+((a.moves||[]).map(x=>moveKo[x]).filter(Boolean).slice(0,3).join(' / ')||'기술 정보 확인 중')}function initials(s){return [...s].map(c=>{let n=c.charCodeAt(0)-44032;return n>=0&&n<11172?'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'[Math.floor(n/588)]:c}).join('')}function suggestions(i){let q=$('s'+i).value.trim(),el=$('suggest'+i);el.replaceChildren();if(!q)return;let matches=Object.entries(names).filter(([id,n])=>n.startsWith(q)||initials(n).startsWith(q)||n.includes(q)).sort((a,b)=>Number(b[1].startsWith(q))-Number(a[1].startsWith(q))).slice(0,12);for(let [id,n] of matches){let b=document.createElement('button'),im=document.createElement('img');im.src='/art/'+id;im.alt='';b.append(im,document.createTextNode(n));b.onclick=()=>{ids[i]=+id;el.replaceChildren();reset()};el.append(b)}}for(let i of [0,1]){$('s'+i).addEventListener('input',()=>suggestions(i));$('s'+i).addEventListener('focus',()=>{$('s'+i).select()});$('s'+i).addEventListener('keydown',e=>{if(e.key==='Enter'){let b=$('suggest'+i).querySelector('button');if(b)b.click()}if(e.key==='Escape')$('suggest'+i).replaceChildren()})}function first(){return (stats[1]?.speed||0)>(stats[0]?.speed||0)?1:0}function damage(i){let a=stats[i],b=stats[1-i];let ratio=a&&b?(Number(a.attack)+Number(a['special-attack']))/(Number(b.defense)+Number(b['special-defense'])):1;if(!Number.isFinite(ratio)||ratio<=0)ratio=1;return Math.max(8,Math.floor((15+Math.random()*10+(strong(i)?12:0))*Math.max(.55,Math.min(2,ratio))))}function explain(i){let a=stats[i],b=stats[1-i];return reason(i)+(a&&b?' 공격력 '+a.attack+' 대 '+b.attack+', 방어력 '+a.defense+' 대 '+b.defense+', 스피드 '+a.speed+' 대 '+b.speed+'. '+(a.speed>b.speed?'더 빨라 먼저 공격해요. ':a.speed<b.speed?'상대가 더 빨라요. ':'속도가 같아요. ')+(a.attack+a['special-attack']>b.defense+b['special-defense']?'공격 능력이 상대 방어 능력보다 높아요.':'상대 방어 능력이 높거나 비슷해요.'):'')}function strong(i){return types[i].some(t=>types[1-i].some(u=>(adv[t]||[]).includes(u)))}function reason(i){let j=1-i;let pairs=types[i].flatMap(t=>types[j].filter(u=>(adv[t]||[]).includes(u)).map(u=>ko[t]+' 속성은 '+ko[u]+' 속성에 강해요.'));return pairs.length?pairs.join(' '):'상대에게 특별히 강한 속성이 없어요.'}function odds(){let el=$('odds');if(!types[0].length||!types[1].length){el.textContent='속성 확인 후 승률을 계산해요…';return}let wins=0;for(let k=0;k<3000;k++){let h=[100,100],t=first();while(h[0]>0&&h[1]>0){let i=t++%2;h[1-i]-=damage(i)}if(h[1]<=0)wins++}let p=Math.round(wins/30);el.replaceChildren();let title=document.createElement('div');title.textContent='예상 승률 · '+names[ids[0]]+' '+p+'% : '+(100-p)+'% '+names[ids[1]];let bar=document.createElement('div');bar.style.cssText='height:16px;border-radius:12px;margin:10px 0;background:linear-gradient(to right,#38bdf8 '+p+'%,#fb7185 '+p+'%)';let desc=document.createElement('small');desc.textContent=p===50?'두 포켓몬이 비슷해요!':(names[ids[p>50?0:1]]||'포켓몬')+'가 유리해요! '+reason(p>50?0:1);el.append(title,bar,desc)}function badges(i){let el=$('t'+i);el.replaceChildren(...types[i].map(t=>{let x=document.createElement('span');x.className='typebadge';let z=typeStyle[t]||['⭐','#555'];x.style.background=z[1];x.textContent=z[0]+' '+(ko[t]||t);return x}))}function showWinner(i){let w=$('winner');w.hidden=false;$('odds').hidden=true;$('log').hidden=true;w.replaceChildren();let img=document.createElement('img');img.src='/art/'+ids[i];let label=document.createElement('div');label.textContent='🏆 '+(names[ids[i]]||'#'+ids[i])+' 승리!';let sub=document.createElement('small');sub.textContent='두 포켓몬 모두 잘 싸웠어!';let why=document.createElement('p');why.style.fontSize='16px';why.textContent='이긴 이유: '+reason(i)+' '+(stats[i]&&stats[1-i]&&stats[i].speed>stats[1-i].speed?'스피드가 빨라 먼저 공격했어요. ':'')+'상대의 체력을 먼저 0으로 만들었어요. 진 이유: '+reason(1-i)+' 체력이 먼저 떨어졌어요.';w.append(img,label,sub,why)}function say(s){$('log').textContent=s;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='ko-KR';speechSynthesis.speak(u)}catch{}}async function load(){try{let r=await fetch('/names');if(!r.ok)throw Error();let a=await r.json();for(let [id,n] of a)names[id]=n;$('dex').replaceChildren(...Object.entries(names).map(([id,n])=>{let o=document.createElement('option');o.value=n;return o}));$('status').textContent=Object.keys(names).length+'종의 포켓몬!'}catch{$('status').textContent='도감 연결 실패 · 새로고침해 주세요'}}async function draw(i){let id=ids[i];$('n'+i).textContent=names[id]||'#'+id;$('s'+i).value=names[id]||id;let im=$('i'+i);im.onerror=()=>{im.onerror=null;im.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/'+id+'.png'};im.src='/art/'+id;types[i]=[];stats[i]=null;$('stats'+i).replaceChildren();$('moves'+i).textContent='기술 확인 중…';$('t'+i).textContent='속성 확인 중…';try{let a=await fetch('/type/'+id).then(r=>{if(!r.ok)throw Error();return r.json()});if(ids[i]!==id)return;types[i]=Array.isArray(a)?a:(Array.isArray(a.types)?a.types:[]);stats[i]=a.stats||null;cardStats(i,a);badges(i);if(turn===0&&stats[0]&&stats[1])turn=first();odds()}catch{$('t'+i).textContent='속성 연결 실패 · 다시 시도'}}function reset(){$('odds').hidden=false;$('log').hidden=false;for(let i of [0,1])$('suggest'+i).replaceChildren();$('battleStart').disabled=false;$('battleStart').textContent='⚔️ 대결 시작!';$('odds').textContent='승률 계산 중…';$('winner').hidden=true;epoch++;busy=false;hp=[100,100];turn=0;[0,1].forEach(i=>{$('h'+i).value=100;$('hp'+i).textContent='HP 100 / 100';draw(i)})}function pick(s){return Number(Object.keys(names).find(k=>names[k]===s))||0}for(let i of [0,1])$('s'+i).onchange=()=>{let id=pick($('s'+i).value);if(id){ids[i]=id;reset()}else say('도감에서 이름을 골라 줘!')};function chat(s){let a=Object.entries(names).filter(([id,n])=>s.includes(n)).sort((a,b)=>s.indexOf(a[1])-s.indexOf(b[1])||b[1].length-a[1].length);if(a.length){ids[0]=+a[0][0];if(a[1])ids[1]=+a[1][0];reset();say(names[ids[0]]+' 대 '+names[ids[1]]+'!')}else if(s.includes('공격'))attack();else say('좋아하는 포켓몬 이름을 말해 줘!')}let recognition=null;function mic(){const b=$('micButton'),s=$('micStatus');if(recognition){recognition.stop();return}let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){s.textContent='이 브라우저는 음성 인식을 지원하지 않아요. Chrome에서 열어 주세요.';return}if(!window.isSecureContext){s.textContent='HTTPS 주소에서 열어 주세요.';return}try{speechSynthesis.cancel()}catch{}let r=new R();recognition=r;r.lang='ko-KR';r.interimResults=true;r.maxAlternatives=3;b.textContent='⏹ 듣기 종료';s.textContent='🎙️ 마이크 연결 중…';r.onstart=()=>{s.textContent='🔴 듣고 있어요! 포켓몬 이름을 말해 주세요.'};r.onresult=e=>{let t=e.results[e.results.length-1][0].transcript;s.textContent='들은 말: '+t;if(e.results[e.results.length-1].isFinal){$('chat').value=t;chat(t)}};r.onerror=e=>{s.textContent=({'not-allowed':'마이크 권한이 차단됐어요. Chrome 사이트 설정에서 마이크를 허용해 주세요.','no-speech':'목소리를 듣지 못했어요. 다시 눌러 주세요.','network':'음성 인식 서버 연결 실패. 인터넷과 Chrome을 확인해 주세요.','audio-capture':'마이크를 사용할 수 없어요.'})[e.error]||'음성 인식 오류: '+e.error};r.onend=()=>{recognition=null;b.textContent='🎙️ 이름 말하기';if(s.textContent.includes('듣고 있어요')||s.textContent.includes('연결 중'))s.textContent='듣기 종료 · 다시 눌러 주세요.'};try{r.start()}catch(e){recognition=null;b.textContent='🎙️ 이름 말하기';s.textContent='마이크 시작 실패: '+e.message}}function randomBattle(){ids=[1+Math.floor(Math.random()*1025),1+Math.floor(Math.random()*1025)];reset()}const adv={fire:['grass','ice','bug','steel'],water:['fire','rock','ground'],grass:['water','rock','ground'],electric:['water','flying'],ice:['dragon','grass','ground','flying'],ground:['electric','fire','steel','rock','poison'],fairy:['dragon','dark','fighting'],fighting:['normal','rock','steel','ice','dark'],dark:['psychic','ghost'],psychic:['fighting','poison'],dragon:['dragon'],ghost:['psychic','ghost'],rock:['fire','flying','ice','bug'],flying:['grass','fighting','bug'],steel:['ice','rock','fairy'],poison:['grass','fairy'],bug:['grass','psychic','dark']};function attack(){if(hp.includes(0))return;let i=turn++%2,j=1-i;let advantage=strong(i);hp[j]=Math.max(0,hp[j]-damage(i));$('h'+j).value=hp[j];$('hp'+j).textContent='HP '+hp[j]+' / 100';if(hp[j]===0)showWinner(i);$('c'+j).classList.remove('hit');void $('c'+j).offsetWidth;$('c'+j).classList.add('hit');say(hp[j]===0?'🏆 '+names[ids[i]]+' 승리! 둘 다 잘 싸웠어!':names[ids[i]]+' 공격! '+(advantage?'효과가 굉장해!':''))}async function auto(){if(busy)return;if(hp.includes(0)){reset()}busy=true;let e=epoch;let btn=$('battleStart');btn.disabled=true;btn.textContent='⚔️ 대결 중…';try{if(hp[0]===100&&hp[1]===100)turn=first();for(let k=0;k<30&&e===epoch&&!hp.includes(0);k++){attack();await new Promise(r=>setTimeout(r,1400))}}catch(err){say('대결 오류: '+err.message)}finally{if(e===epoch){busy=false;btn.disabled=false;btn.textContent=hp.includes(0)?'⚔️ 다시 대결!':'⚔️ 대결 시작!'}}}reset();load()</script></html>
