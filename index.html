<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>포켓몬 카드 아레나</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/prism.css"></head>
<body><header><div class="bar">
<div class="brandblock"><a href="#battle" class="brand"><i class="ball" aria-hidden="true"></i><span data-en="Card Arena">카드 아레나</span></a><b id="visits" data-en="Counting today’s visitors…">오늘 방문자 집계 중…</b></div>
<nav aria-label="게임 메뉴" data-en-label="Game menu"><a href="#battle" data-en="Battle">대결</a><a href="#dex" data-en="Pokédex">도감</a><a href="#friend" data-en="AI Buddy">AI 친구</a><a href="#history" data-en="History">기록</a></nav>
<button id="language" type="button">English</button><button class="gear" id="settings" aria-label="부모 설정" data-en-label="Parent settings">⚙</button></div></header>
<main><p id="loading" data-en="Opening your cards…">포켓몬 카드를 꺼내고 있어요…</p>
<section id="battle" hidden><div class="title"><div><h1><span data-en="Pokémon Battle">포켓몬 대결</span></h1></div></div>
<div class="battle-layout"><div class="pair"><div id="slot0"></div><div id="slot1"></div></div>
<div class="match-area"><details id="prediction"><summary data-en="Win chances">예상 승률</summary><div id="odds"></div></details>
<article id="arena"><div class="arenahead"><span data-en="●　Battlefield">●　배틀 필드</span><b id="round"></b></div><div class="field"><canvas id="land" width="480" height="160" aria-hidden="true"></canvas><div id="actors"></div><i id="fx" aria-hidden="true"></i></div><p id="log" aria-live="polite"></p><aside id="hit-lesson" hidden><strong data-en="Why was that such a big hit?">왜 이렇게 많이 줄었을까?</strong><p id="hit-reason" aria-live="polite"></p><button type="button" id="continue-hit" data-en="Keep watching">계속 보기</button></aside></article><div class="actions"><button class="mainbtn" id="start" data-en="▶ Start battle">▶ 대결 시작</button></div><div id="result" hidden></div></div></div></section>
<section id="dex" hidden><div class="title"><div><h1><span data-en="Pokédex">포켓몬 도감</span></h1><p data-en="Explore 1,025 species and 48 Mega forms.">전국도감 1,025종과 메가진화 48개 폼을 만나 봐.</p></div></div>
<div class="dex-tools"><input id="dexquery" placeholder="이름 · 초성 · 도감 번호" data-en-placeholder="Name or Pokédex number" aria-label="도감 검색" data-en-label="Search Pokédex">
<div class="filters"><label><span data-en="Type">속성</span><select id="typeFilter"></select></label><label><span data-en="Category">분류</span><select id="kindFilter"></select></label><label><span data-en="Region">지방</span><select id="regionFilter"></select></label></div>
<div class="dex-nav"><div class="switch"><button id="dexOrder" aria-pressed="true" data-en="Dex order">도감 번호순</button><button id="powerOrder" aria-pressed="false" data-en="Power ranking">파워 순위</button></div><span id="found" role="status"></span></div></div>
<p id="rankRule" hidden data-en="Overall rank by the sum of all six base stats. Equal totals share a rank.">6개 종족값의 합계로 매긴 전체 순위입니다. 합계가 같으면 공동 순위입니다.</p>
<div id="catalog"></div><button id="more" data-en="Show more">더 보기</button></section>
<section id="friend" hidden><div class="title"><div><h1><span data-en="AI Pokémon Buddy">AI 포켓몬 친구</span></h1><p data-en="Ask about your favorite Pokémon!">좋아하는 포켓몬 이야기를 나눠 봐!</p></div></div><div class="panel"><div class="conversation"><img class="buddy" src="/art/25" alt="Pikachu"><div id="talk" role="log"></div></div><div id="examples"><button data-en="What makes Reshiram strong?">레시라무는 왜 강해?</button><button data-en="What moves does Squirtle know?">꼬부기는 무슨 기술을 써?</button><button data-en="Who can beat Mewtwo?">뮤츠보다 강한 포켓몬은 누구야?</button></div><form id="chat"><input maxlength="250" id="message" required aria-label="친구에게 할 말" data-en-label="Ask your buddy" placeholder="궁금한 걸 물어봐" data-en-placeholder="Ask your buddy"><button type="button" data-mic data-en="🎙 Talk">🎙 말하기</button><button type="submit" class="mainbtn" data-en="Send">보내기</button></form></div></section>
<section id="history" hidden><div class="title"><div><h1><span data-en="Battle history">대결 기록</span></h1><p data-en="Recent battles on this device.">이 기기에서 함께한 최근 대결이야.</p></div></div><div id="records"></div></section>
<div id="speech" hidden role="status"></div></main><footer><span data-en="Unofficial fan game · Pokémon © Nintendo / Creatures / GAME FREAK">비공식 포켓몬 팬 게임 · Pokémon © Nintendo / Creatures / GAME FREAK</span></footer>
<dialog id="modal"><div id="modalbody"></div><button id="close" data-en="Close">닫기</button></dialog>
<script defer src="/game.js"></script><script defer src="/locale.js"></script><script defer src="/visit.js"></script><script defer src="/field.js"></script><script defer src="/narrator.js"></script><script defer src="/app.js"></script></body></html>
