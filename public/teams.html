<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>3:3 팀 배틀 · 카드 아레나</title><link rel="stylesheet" href="/teams.css"><link rel="icon" type="image/png" sizes="192x192" href="/henry-192.png"><link rel="apple-touch-icon" href="/henry-192.png"><link rel="manifest" href="/manifest.webmanifest"></head>
<body><header><div><a id="home" href="/#battle" data-en="⚡ Card Arena">⚡ 카드 아레나</a><button id="language">English</button></div></header>
<main>
 <h1 data-en="3 vs 3 Team Battle">3:3 팀 배틀</h1>
 <p class="rules" data-en="Pick three Pokémon in battle order. Each battles its opposite number once. The team with more wins takes the match.">세 마리를 출전 순서대로 골라 줘. 같은 순번끼리 한 번씩 겨뤄서 더 많이 이긴 팀이 승리해.</p>
 <section id="setup" hidden>
  <div class="modes" aria-label="Mode"><button id="practice" data-en="Practice">혼자 연습</button><button id="friends" data-en="Play with a friend">친구와 대결</button></div>
  <div id="lineups"></div>
  <button class="primary" id="launch"></button>
 </section>
 <section id="waiting" hidden><h2 data-en="Invite a friend">친구 초대</h2><p data-en="Send this link to a friend. The match starts when they confirm their three Pokémon.">친구에게 링크를 보내 줘. 친구가 세 마리를 고르고 참가하면 대결이 시작돼.</p>
  <label for="invite" data-en="Room link">대결방 링크</label><input id="invite" readonly>
  <div class="share-actions"><button id="share" class="primary" data-en="Share invite">링크 보내기</button><button id="copy" data-en="Copy link">링크 복사</button></div>
  <p id="share-hint" role="status"></p>
  <div id="locked-team"></div><a class="back" href="/teams.html" data-en="Team selection">팀 선택으로</a>
 </section>
 <section id="watch" hidden><div class="round-head"><h2 id="round-title"></h2><button id="finish" data-en="Team result">팀 결과 보기</button></div><div id="live-score"></div><div id="stage"></div></section>
 <section id="result" hidden>
  <div class="podium"><div class="result-heading"><span class="trophy" aria-hidden="true">🏆</span><h2 id="verdict"></h2></div>
   <div id="champions"></div><div id="score"></div></div>
  <div class="result-body"><div class="actions"><button id="rematch" class="primary" data-en="Rematch">재대결</button><button id="replay" data-en="Watch again">다시 보기</button><a class="back" href="/teams.html" data-en="New teams">새 팀 대결</a><a class="back" href="/#battle">HOME</a></div>
   <p id="rematch-status" role="status"></p><h3 data-en="Round results">경기별 결과</h3><div id="rounds"></div></div>
 </section>
 <p id="notice" role="status" aria-live="polite"></p><a id="restart" hidden href="/teams.html" data-en="Start a new match">새 대결 열기</a>
</main>
<dialog id="picker"><form method="dialog"><strong id="pick-title"></strong><button aria-label="닫기" data-en-label="Close">✕</button></form><div class="pick-search"><input id="query" type="search" placeholder="검색" data-en-placeholder="Search" aria-label="포켓몬 검색" data-en-label="Search Pokémon" autocomplete="off"><button id="pick-mic" type="button" aria-pressed="false" data-en="🎤 Speak">🎤 말하기</button></div><p id="mic-status" role="status"></p><div id="choices"></div></dialog>
<script src="/game.js"></script><script src="/locale.js"></script><script src="/teams.js"></script></body></html>
